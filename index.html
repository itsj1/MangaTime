<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MangaTime">
<meta name="theme-color" content="#111213">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>MangaTime</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--ink:#0b0b0a;--mut:#6f6f6b;--acc:#ffd400;--act:#8a6d00;--tint:#fff1a8;--on:#1a1500;--red:#e5484d;--ok:#16a34a;--line:#e6e6e2;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111213;--card:#1c1d1f;--ink:#f4f4f0;--mut:#9a9ca0;--acc:#ffd400;--act:#ffd400;--tint:#3b3410;--on:#1a1500;--red:#f06a6a;--ok:#34d27b;--line:#2f3134;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Trebuchet MS",system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(100px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font:800 28px/1.15 "Avenir Next","Trebuchet MS",system-ui,sans-serif;letter-spacing:-.01em;margin:16px 0}
h2{font:700 18px/1.2 "Avenir Next","Trebuchet MS",system-ui,sans-serif;margin:22px 0 10px}
header{display:flex;align-items:center;justify-content:space-between}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:16px;outline:none}
input:focus{border-color:var(--acc)}
.mut{color:var(--mut);font-size:14px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}

/* Barre d'onglets (même pilule flottante que Muscu) */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 24px));display:flex;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5}
.tabs button{flex:1;min-width:0;border-radius:999px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;padding:6px 2px;color:var(--mut)}
.tabs button.on{background:var(--tint);color:var(--act);font-weight:700}
.tabs span{display:block;height:24px;margin-bottom:2px}

/* Filtres */
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px -12px;padding:0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}

/* Recherche */
.srch{position:relative;margin:4px 0 2px}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch input{padding:12px 46px 12px 44px;border-radius:999px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center}
.clr svg{position:static;transform:none;color:var(--ink)}
.clr[hidden]{display:none}

/* Grille de posters : 3 par ligne */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:12px 0;align-items:start}
.pc{text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;align-self:start;min-width:0}
.im{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-size:12px;color:var(--mut)}
.tg{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:999px;text-transform:uppercase}
.in{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center}
.pc b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.25;height:2.5em;margin-top:6px;font-weight:600}
.pc small{display:block;font-size:11px;line-height:1.3;min-height:1.3em;color:var(--mut);margin-top:2px}
.pb{height:5px;border-radius:9px;background:var(--line);margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--acc);border-radius:9px}
.pb.dn i{background:var(--ok)}
/* My List : rangées qui défilent sur le côté, environ 4 posters par écran */
.hs{display:flex;gap:10px;overflow-x:auto;margin:0 -12px;padding:0 12px 6px;scroll-padding:0 12px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hs::-webkit-scrollbar{display:none}
.hs .pc{flex:none;width:calc((100% - 30px)/4.2);scroll-snap-align:start}
.hs .pc b{font-size:12px}
.hs .tg{display:none}
.hs.mix .tg{display:block;font-size:8px;padding:2px 5px;left:4px;top:4px}
.gen{font-size:13px;color:var(--act);margin-top:3px}
.hs.cast{gap:12px}
.ca{flex:none;width:84px;text-align:center;scroll-snap-align:start}
.ph2{display:grid;place-items:center;width:76px;height:76px;margin:0 auto 6px;border-radius:50%;overflow:hidden;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:700}
.ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.ca b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.25;font-weight:600}
.ca small{display:block;font-size:11px;line-height:1.25;color:var(--mut);margin-top:2px}
.ca em{display:inline-block;margin-top:4px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--tint);color:var(--act)}
h2 small,h1 small{font-weight:500;font-size:14px;color:var(--mut);margin-left:6px;letter-spacing:0}
.h2r{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.h2r button{font-size:14px;font-weight:600;color:var(--act);padding:4px 0 4px 10px}
.pc.lm b{height:auto}
.grid:not(.mix) .pc.lm .tg{display:none}
header.sh{justify-content:flex-start;gap:12px}
/* Vignette d'épisode */
.et{flex:none;width:86px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line)}
.et img{width:100%;height:100%;object-fit:cover;display:block}

/* Lignes de l'accueil */
.rw{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0}
.rw .th{flex:none;width:52px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--line)}
.rw .th img{width:100%;height:100%;object-fit:cover;display:block}
.rw .tx{flex:1;min-width:0;text-align:left}
.rw .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.rw .tx span{display:block;font-size:13px;color:var(--mut)}
.rw .tx em{font-style:normal;color:var(--act);font-weight:700}
.dd{flex:none;text-align:right;font-size:13px;line-height:1.25}
.dd b{display:block;color:var(--act);font-size:14px}
.dd small{color:var(--mut)}

/* Home « Suivant » : liste ou grille */
.hbt{display:flex;align-items:center;gap:6px}
.h2r>small{font-weight:500;font-size:13px;color:var(--mut);margin:0}
.hv{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.nr{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.nr .th{flex:none;width:84px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.nr .th img{width:100%;height:100%;object-fit:cover;display:block}
.nr .tx{flex:1;min-width:0;text-align:left}
.nr .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;line-height:1.2;font-weight:700}
.nl{display:block;margin-top:5px;font-size:14px;color:var(--mut)}
.nl strong{color:var(--ink);font-size:16px;font-weight:800}
.nr .tx em{display:block;font-style:normal;font-size:13px;font-weight:700;color:var(--act);margin:8px 0 4px}
.nr .pb{display:block;height:6px;margin:0}
.nr .ck{width:42px;height:42px;border-color:var(--ink);color:var(--ink)}
.nr .ck:active{background:var(--acc);border-color:var(--acc);color:var(--on)}
.ob{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.55)}
.ob i{display:block;height:100%;background:var(--acc)}
.epo{max-height:38dvh;overflow-y:auto}
/* Bouton rond « vu » */
.ck{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:transparent;transition:transform .12s}
.ck:active{transform:scale(.88)}
.ck.on{background:var(--acc);border-color:var(--acc);color:var(--on);animation:pop .22s}
.ck:disabled{opacity:.3;cursor:default}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.empty{text-align:center;color:var(--mut);padding:36px 20px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.stats{display:flex;gap:8px;text-align:center;margin:6px 0 4px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px}
.stats b{display:block;font:800 22px "Avenir Next","Trebuchet MS",system-ui,sans-serif;color:var(--act)}
.stats span{font-size:12px;color:var(--mut)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:14px;color:var(--mut);margin:10px 0}
.note button{color:var(--act);font-weight:700;text-decoration:underline}
.err{color:var(--red);font-size:14px;margin:12px 0}

/* Fiche d'une œuvre */
.hero{position:relative;margin:0 -12px;height:190px;background:var(--card) center/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 40%,var(--bg))}
.bk{position:fixed;left:max(12px,calc(50% - 320px));top:calc(10px + env(safe-area-inset-top));z-index:4;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bk.mo{left:auto;right:max(12px,calc(50% - 320px))}
.hd{display:flex;gap:14px;align-items:flex-end;margin-top:-90px;position:relative}
.hd .po{flex:none;width:112px;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hd .po img{width:100%;height:100%;object-fit:cover;display:block}
.hd h1{font-size:22px;margin:0 0 4px}
.big{display:block;width:100%;padding:15px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:700;font-size:17px;margin:16px 0 6px}
.prg{margin:16px 0 4px}
.prg .pb{height:8px;margin:0 0 6px}
.prg div:last-child{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.nxt{display:flex;gap:10px;align-items:center;background:var(--tint);color:var(--act);border-radius:14px;padding:12px;margin:12px 0;font-size:14px}
.nxt b{display:block;font-size:15px}
.desc{font-size:14px;color:var(--mut);margin:12px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.desc.op{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.box label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.inl{display:flex;gap:8px}
.inl input{flex:1;min-width:0}
.inl button{flex:none;padding:0 18px;border-radius:14px;background:var(--acc);color:var(--on);font-weight:700}
.days{display:flex;gap:6px}
.days button{flex:1;padding:9px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.days button.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.gp{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:12px}
.gh .gt{flex:1;text-align:left;display:flex;align-items:center;gap:8px;min-width:0}
.gh .gt b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .gt small{color:var(--mut);font-size:13px;flex:none}
.gh .gt svg{flex:none;color:var(--mut);transition:transform .15s}
.gp.op .gh .gt svg{transform:rotate(90deg)}
.er{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.er .tx{flex:1;min-width:0}
.er .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.25;font-weight:600}
.em{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mut);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.em[hidden]{display:none}
.er .tx small{color:var(--mut);font-size:12px}
.er.fu .tx{opacity:.55}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;padding:12px;border-top:1px solid var(--line)}
.gp>.cg:first-child{border-top:0}
.cn{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);font-size:14px;font-weight:600;display:grid;place-items:center}
.cn.on{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:700}
.cn:active{transform:scale(.9)}
.more{display:block;width:100%;padding:12px;border-top:1px solid var(--line);color:var(--act);font-weight:700;font-size:14px}
.rm{display:block;margin:22px auto 0;color:var(--red);font-size:14px;padding:10px}

/* Feuilles et pop-ups (mêmes formes que Muscu) */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fd .18s}
.sov.pop{align-items:center;padding:20px}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;will-change:transform;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.22,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px;position:relative}
.grab:after{content:"";position:absolute;inset:-14px -60px}
.sheet h2{margin:4px 0 4px;font-size:22px}
.sheet.cfg{background:var(--bg)}
.opl{font:12px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--mut);margin:22px 4px 8px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.orow{padding:14px 16px;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow.fld{display:flex;flex-direction:column;gap:8px}
.orow.fld b{font-size:17px;font-weight:600}
.orow.hint{font-size:14px;color:var(--mut)}
.soft{background:color-mix(in srgb,var(--ink) 4%,var(--card));border:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-weight:600}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;margin:10px 0}
.mi i{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.mi b{display:block;font-size:18px;font-weight:600;line-height:1.25}
.mi small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.mi.gr i{background:var(--acc);color:var(--on)}
.mi.red b{color:var(--red)}
.mi.red i{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.mi small:empty{display:none}
.cred{font-size:12px;color:var(--mut);margin:20px 4px 0}
.sov.out{animation:fdo .26s ease-in forwards}
.sov.out .sheet{animation:dn .28s cubic-bezier(.4,0,.8,.4) forwards}
.sov.out .dpop{animation:ppo .2s ease-in forwards}
@keyframes fdo{to{opacity:0}}
@keyframes dn{to{transform:translateY(100%)}}
@keyframes ppo{to{transform:scale(.92);opacity:0}}
.sheet a{color:var(--act)}
.dpop{background:var(--card);width:100%;max-width:330px;border-radius:36px;padding:24px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.28);animation:pp .2s}
.dpop h3{margin:0 0 8px;font:600 20px "Avenir Next","Trebuchet MS",system-ui,sans-serif}
.dpop p{margin:0 0 6px;color:var(--mut);font-size:15px}
.dbt{display:block;width:100%;border-radius:999px;padding:15px 12px;margin-top:10px;background:color-mix(in srgb,var(--ink) 7%,var(--card));font:500 17px "Avenir Next","Trebuchet MS",system-ui,sans-serif}
.dbt.gr{background:var(--acc);color:var(--on);font-weight:700}
.dbt.red{color:var(--red)}
.dbt.tx{background:none;color:var(--mut)}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pp{from{transform:scale(.92);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id=app></main>
<script>
/* ============ MangaTime — suivi mangas / webtoons / animés / séries ============
   Données : localStorage + synchro optionnelle dans un dépôt GitHub privé (comme Muscu).
   Sources : AniList (animés, mangas, manhwas) et TMDB (séries). */
const K='mangatime-v1',IMG='https://image.tmdb.org/t/p/',DAY=864e5;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=(n,w)=>n+' '+w+(n>1?'s':'');

function load(){let s=null;try{s=JSON.parse(localStorage.getItem(K)||'null')}catch{}
 s=s||{};s.items=s.items||{};s.del=s.del||{};s.cfg=Object.assign({repo:'',path:'mangatime-data.json',token:'',tmdb:''},s.cfg||{});s.sha=s.sha||'';return s}
let S=load();
function persist(){try{localStorage.setItem(K,JSON.stringify(S))}catch{}}
function touch(it){it.u=Date.now();S.dirty=1;persist();schedSync()}

/* État d'affichage */
let TAB='home',VIEW=null,F=null,Q='',DT='A',FT='all',FS='all',RES=null,RERR='',BUSY=false,MSG='',SUBV=null;const SCRS=[];
const BR={},DET={},OPEN={};          // œuvres vues en recherche, détails chargés, groupes dépliés
const obj=k=>S.items[k]||BR[k];

/* Icônes */

/* ============ Sources de données ============ */
const ALF='id type format status episodes chapters genres countryOfOrigin startDate{year} title{romaji english} coverImage{large} nextAiringEpisode{episode airingAt}';
async function al(query,variables){
 const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables})});
 if(r.status===429)throw new Error('Trop de requêtes vers AniList, réessaie dans une minute.');
 const j=await r.json();if(j.errors)throw new Error('AniList : '+j.errors[0].message);return j.data}
const GFR={Adventure:'Aventure',Comedy:'Comédie',Drama:'Drame',Fantasy:'Fantastique',Horror:'Horreur',Mystery:'Mystère','Sci-Fi':'Science-fiction','Slice of Life':'Tranche de vie',Sports:'Sport',Supernatural:'Surnaturel',Psychological:'Psychologique',Music:'Musique'};
function fromAL(m){const A=m.type==='ANIME',nx=m.nextAiringEpisode;
 return{k:'al:'+m.id,src:'al',id:m.id,ty:A?'A':'M',t:m.title.english||m.title.romaji||'Sans titre',p:(m.coverImage||{}).large||'',
  lb:A?({MOVIE:'Film',OVA:'OVA',ONA:'ONA',SPECIAL:'Spécial'}[m.format]||'Animé'):m.format==='NOVEL'?'Roman':({KR:'Manhwa',CN:'Manhua'}[m.countryOfOrigin]||'Manga'),
  tot:(A?m.episodes:m.chapters)||0,st:{FINISHED:'fin',RELEASING:'rel',NOT_YET_RELEASED:'soon',CANCELLED:'stop',HIATUS:'hia'}[m.status]||'',yr:(m.startDate||{}).year||0,
  g:(m.genres||[]).slice(0,3).map(x=>GFR[x]||x),nx:nx?{e:nx.episode,at:nx.airingAt*1000}:null}}
async function tm(path,params){const key=(S.cfg.tmdb||'').trim();if(!key)throw new Error('NOKEY');
 const u=new URL('https://api.themoviedb.org/3/'+path);u.searchParams.set('language','fr-FR');for(const k in params||{})u.searchParams.set(k,params[k]);
 const h={Accept:'application/json'};if(key.length>60)h.Authorization='Bearer '+key;else u.searchParams.set('api_key',key);
 const r=await fetch(u,{headers:h});if(r.status===401)throw new Error('Clé TMDB refusée : vérifie-la dans les réglages.');if(!r.ok)throw new Error('TMDB '+r.status);return r.json()}
/* Animé = animation d'origine japonaise ; TMDB regroupe toutes les saisons dans une seule fiche */
const isAni=r=>(r.genre_ids||(r.genres||[]).map(g=>g.id)).includes(16)&&r.original_language==='ja';
const fromTM=r=>({k:'tm:'+r.id,src:'tm',id:r.id,ty:isAni(r)?'A':'T',t:r.name||r.original_name||'Sans titre',p:r.poster_path?IMG+'w342'+r.poster_path:'',lb:isAni(r)?'Animé':'Série',tot:0,st:'',yr:+(r.first_air_date||'').slice(0,4)||0,nx:null});
const dloc=d=>{const[y,m,j]=d.split('-').map(Number);return new Date(y,m-1,j).getTime()};
function applyTM(it,d){
 it.t=d.name||it.t;if(d.genres&&d.original_language){const an=isAni(d);it.ty=an?'A':'T';it.lb=an?'Animé':'Série';it.g=d.genres.filter(g=>g.id!==16||!an).slice(0,3).map(g=>g.name)}if(d.poster_path)it.p=IMG+'w342'+d.poster_path;
 const old={};(it.ss||[]).forEach(x=>old[x[0]]=x);   // on garde le n° du 1er épisode déjà connu pour chaque saison
 it.ss=(d.seasons||[]).filter(s=>s.season_number>0&&s.episode_count>0).map(s=>{const o=old[s.season_number];return[s.season_number,s.episode_count,s.name||'Saison '+s.season_number,o?o[3]||1:1,o?o[4]||0:0]});
 it.tot=it.ss.reduce((a,s)=>a+s[1],0);
 const l=d.last_episode_to_air,n=d.next_episode_to_air;
 it.la=l?[l.season_number,l.episode_number]:null;
 it.nx=n&&n.air_date?{s:n.season_number,e:n.episode_number,at:dloc(n.air_date),d:1}:null;
 it.st=d.status==='Ended'?'fin':d.status==='Canceled'?'stop':it.la?'rel':'soon';it.yr=+(d.first_air_date||'').slice(0,4)||it.yr}
/* Reporte les infos fraîches sur une œuvre sans toucher à ta progression */
function meta(it,f){for(const k of['t','p','lb','tot','st','yr','nx','g'])it[k]=f[k]}

/* ============ Épisodes / chapitres ============ */
const seenSet=it=>new Set(it.w||[]);
const maxSeen=it=>it.src==='tm'?0:(it.w||[]).reduce((a,b)=>Math.max(a,b),0);
/* Liste complète : {id,s?,e,ok} — ok = déjà sorti, donc cochable */
function eps(it){const out=[];
 if(it.src==='tm'){const la=it.la,fin=it.st==='fin'||it.st==='stop';
  (it.ss||[]).forEach(([n,c,,f])=>{f=f||1;for(let e=f;e<f+c;e++)out.push({id:n+'-'+e,s:n,e,ok:la?(n<la[0]||(n===la[0]&&e<=la[1])):fin})});return out}
 const mx=maxSeen(it);let n,av;
 if(it.ty==='A'){av=it.st==='soon'?0:it.nx?it.nx.e-1:it.tot;n=it.tot||Math.max(av,mx,it.nx?it.nx.e:0);
  if(!n&&it.st!=='soon')n=av=Math.max(mx+1,it.cnt||12);av=Math.max(av,mx)}
 else{n=it.tot||Math.max(mx+1,it.cnt||25);av=n}
 for(let e=1;e<=n;e++)out.push({id:e,e,ok:e<=av});return out}
const unit=it=>it.ty==='M'?'chapitre':'épisode';
const epLab=(it,x)=>it.src==='tm'?'S'+x.s+' · E'+x.e:(it.ty==='M'?'Chapitre ':'Épisode ')+x.e;
function prog(it){const L=eps(it),w=seenSet(it);let seen=0,left=0,next=null;
 for(const x of L){if(w.has(x.id))seen++;else if(x.ok){left++;if(!next)next=x}}
 const open=it.ty==='M'&&!it.tot;                       // manga en cours : total inconnu
 const total=open?Math.max(maxSeen(it),1):L.length;
 return{L,w,seen,left,next,total,open,pct:total?Math.min(100,Math.round(seen/total*100)):0}}
const parseId=(it,v)=>it.src==='tm'?v:+v;

function ensure(k){let it=S.items[k];if(it)return it;it=BR[k];if(!it)return null;
 it.w=it.w||[];it.s='cur';it.a=Date.now();S.items[k]=it;delete S.del[k];return it}
function commit(it,w){const L=eps(it),n0=(it.w||[]).length;it.w=L.filter(x=>w.has(x.id)).map(x=>x.id);if(it.w.length>n0)it.lw=Date.now();
 const all=L.length&&L.every(x=>w.has(x.id));
 if(all&&(it.st==='fin'||it.st==='stop'))it.s='done';
 else if(it.w.length&&(it.s==='plan'||it.s==='done'||!it.s))it.s='cur';
 touch(it);render()}
function tog(k,v){const it=ensure(k);if(!it)return;const id=parseId(it,v),w=seenSet(it);
 if(w.has(id)){w.delete(id);return commit(it,w)}
 const L=eps(it),i=L.findIndex(x=>x.id===id);if(i<0||!L[i].ok)return;
 const prev=L.slice(0,i).filter(x=>x.ok&&!w.has(x.id));
 if(prev.length){F={k:'ask',key:k,id,n:prev.length,lab:epLab(it,L[i])};return render()}
 w.add(id);commit(it,w)}
function markUpTo(k,id,withPrev){const it=ensure(k);if(!it)return;const w=seenSet(it),L=eps(it),i=L.findIndex(x=>x.id===id);
 if(withPrev)L.slice(0,i).forEach(x=>x.ok&&w.add(x.id));w.add(id);F=null;commit(it,w)}

/* ============ Dates de sortie ============ */
const today0=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
function nextOut(it){
 if(it.nx&&it.nx.at>=(it.nx.d?today0():Date.now()-3600e3))return{at:it.nx.at,d:it.nx.d,lab:it.src==='tm'?'S'+it.nx.s+' · E'+it.nx.e:'Épisode '+it.nx.e};
 return null}
function when(o){const dd=Math.round((new Date(new Date(o.at).setHours(0,0,0,0))-today0())/DAY),D=new Date(o.at);
 const h=o.d?'':D.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 const a=dd<=0?'Aujourd’hui':dd===1?'Demain':dd<7?D.toLocaleDateString('fr-FR',{weekday:'long'}).replace(/^./,c=>c.toUpperCase()):D.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
 return{a,b:dd<=1?h:(dd<7?D.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+(h?' · '+h:''):'dans '+dd+' j')}}
const STL={fin:'Terminé',rel:'En cours de sortie',soon:'Pas encore sorti',stop:'Annulé',hia:'En pause'};
const UST=[['cur','En cours'],['plan','À voir plus tard'],['done','Terminé'],['pause','En pause'],['drop','Abandonné']];

/* Rafraîchit les dates des œuvres suivies (au lancement, toutes les 6 h au plus) */
async function refreshAll(force){
 const L=Object.values(S.items).filter(it=>['cur','plan','pause'].includes(it.s)&&(force||Date.now()-(it.nf||0)>6*3600e3));if(!L.length)return;
 const A=L.filter(x=>x.src==='al');
 try{for(let i=0;i<A.length;i+=50){const d=await al(`query($ids:[Int]){Page(perPage:50){media(id_in:$ids){${ALF}}}}`,{ids:A.slice(i,i+50).map(x=>x.id)});
  d.Page.media.forEach(m=>{const it=S.items['al:'+m.id];if(it){meta(it,fromAL(m));it.nf=Date.now()}})}}catch{}
 if(S.cfg.tmdb)for(const it of L.filter(x=>x.src==='tm')){try{applyTM(it,await tm('tv/'+it.id));it.nf=Date.now()}catch{}}
 persist();if(!F)render()}

/* ============ Recherche ============ */
let ST=0,SEQ=0;
async function search(){const seq=++SEQ;BUSY=true;RERR='';paintRes();
 try{let L;
  if(DT==='T'||(DT==='A'&&S.cfg.tmdb)){const A=DT==='A';
   const d=Q?await tm('search/tv',{query:Q}):A?await tm('discover/tv',{with_genres:16,with_original_language:'ja',sort_by:'popularity.desc'}):await tm('trending/tv/week');
   L=d.results.map(fromTM).filter(x=>(x.ty==='A')===A)}
  else{const t=DT==='A'?'ANIME':'MANGA';
   const d=Q?await al(`query($q:String,$t:MediaType){Page(perPage:30){media(search:$q,type:$t,sort:POPULARITY_DESC,isAdult:false){${ALF}}}}`,{q:Q,t})
            :await al(`query($t:MediaType){Page(perPage:30){media(type:$t,sort:TRENDING_DESC,isAdult:false){${ALF}}}}`,{t});
   L=d.Page.media.map(fromAL)}
  if(seq!==SEQ)return;
  RES=L.map(x=>{if(S.items[x.k])return S.items[x.k];BR[x.k]=Object.assign(BR[x.k]||{},x);return BR[x.k]})}
 catch(e){if(seq!==SEQ)return;RES=[];RERR=e.message==='NOKEY'?'NOKEY':(navigator.onLine===false?'Pas de connexion internet.':e.message)}
 BUSY=false;paintRes()}

/* ============ Détail ============ */
async function loadDet(k){const it=obj(k);if(!it)return;
 try{if(it.src==='al'){
   const d=await al(`query($id:Int){Media(id:$id){${ALF} description(asHtml:false) bannerImage genres airingSchedule(notYetAired:true,perPage:25){nodes{episode airingAt}}}}`,{id:it.id}),m=d.Media;
   meta(it,fromAL(m));const sc={};((m.airingSchedule||{}).nodes||[]).forEach(n=>sc[n.episode]=n.airingAt*1000);
   DET[k]={desc:(m.description||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,''),ban:m.bannerImage||'',gen:m.genres||[],sc,se:{}}}
  else{const d=await tm('tv/'+it.id,{append_to_response:'aggregate_credits'});applyTM(it,d);
   const cast=((d.aggregate_credits||{}).cast||[]).slice(0,20).map(c=>{const r=((c.roles||[])[0]||{}).character||'';return{n:c.name,p:c.profile_path?IMG+'w185'+c.profile_path:'',r:r.replace(/\s*\(voice\)/ig,'').trim(),v:it.ty==='A'||/\(voice\)/i.test(r)}});
   DET[k]={cast,desc:d.overview||'',ban:d.backdrop_path?IMG+'w780'+d.backdrop_path:'',gen:(d.genres||[]).map(g=>g.name),sc:{},se:{}}}
  it.nf=Date.now();if(S.items[k])persist()}
 catch(e){DET[k]=DET[k]||{desc:'',ban:'',gen:[],sc:{},se:{},err:e.message==='NOKEY'?'Ajoute ta clé TMDB dans les réglages pour charger les épisodes.':e.message}}
 if(VIEW===k){initOpen(k);render()}
 if(it.src==='tm'&&DET[k]&&!DET[k].err)loadSeasons(k)}
/* Certaines œuvres (Hunter x Hunter…) numérotent leurs épisodes en continu d'une saison à l'autre :
   la saison 2 commence à l'épisode 27, pas 1. On cale donc chaque saison sur ses vrais numéros,
   et on décale la progression déjà cochée si la numérotation connue change. */
function setSeason(it,D,n,epi){epi=(epi||[]).filter(e=>e.episode_number>0).sort((a,b)=>a.episode_number-b.episode_number);if(!epi.length)return;
 D.se[n]={};epi.forEach(e=>D.se[n][e.episode_number]={n:e.name,d:e.air_date,s:e.still_path,o:e.overview});
 const x=(it.ss||[]).find(x=>x[0]===n);if(!x)return;
 const f=epi[0].episode_number,c=epi[epi.length-1].episode_number-f+1,f0=x[3]||1;
 if(f!==f0&&it.w&&it.w.length){it.w=it.w.map(id=>{const[a,b]=String(id).split('-');return +a===n?n+'-'+(+b-f0+f):id});if(S.items[it.k])touch(it)}
 x[1]=c;x[3]=f;x[4]=1;it.tot=it.ss.reduce((a,s)=>a+s[1],0)}
async function loadSeasons(k){const it=obj(k),D=DET[k];if(!it||!D)return;const N=(it.ss||[]).map(x=>x[0]).filter(n=>!D.se[n]);
 for(let i=0;i<N.length;i+=20){const part=N.slice(i,i+20);
  try{const d=await tm('tv/'+it.id,{append_to_response:part.map(n=>'season/'+n).join(',')});part.forEach(n=>setSeason(it,D,n,(d['season/'+n]||{}).episodes))}catch{}}
 if(S.items[k])persist();if(VIEW===k&&!F)render()}
async function loadSeason(k,n){const it=obj(k),D=DET[k];if(!it||!D||D.se[n])return;
 try{const d=await tm('tv/'+it.id+'/season/'+n);setSeason(it,D,n,d.episodes);if(S.items[k])persist();if(VIEW===k&&!F)render()}catch{}}
/* Groupes : saisons (séries) ou tranches de 25 (longues œuvres) */
function groups(it,L){
 if(it.src==='tm')return(it.ss||[]).map(([n,c,nm])=>({id:String(n),t:nm,L:L.filter(x=>x.s===n)}));
 if(it.ty==='M'){                                    // mangas : saisons définies par toi, sinon tranches de 100
  if(it.sp&&it.sp.length){const G=[];let i=0,k=0;while(i<L.length){const c=L.slice(i,i+(it.sp[k]||L.length));G.push({id:'s'+k,t:'Saison '+(k+1)+' · ch. '+c[0].e+' – '+c[c.length-1].e,L:c});i+=c.length;k++}return G}
  if(L.length<=150)return[{id:'0',t:'',L}];
  const G=[];for(let i=0;i<L.length;i+=100){const c=L.slice(i,i+100);G.push({id:String(i),t:'Chapitres '+c[0].e+' – '+c[c.length-1].e,L:c})}return G}
 if(L.length<=30)return[{id:'0',t:'',L}];
 const G=[];for(let i=0;i<L.length;i+=25){const c=L.slice(i,i+25);G.push({id:String(i),t:(it.ty==='M'?'Chapitres ':'Épisodes ')+c[0].e+' – '+c[c.length-1].e,L:c})}return G}
function initOpen(k){if(OPEN[k])return;const it=obj(k),P=prog(it),G=groups(it,P.L);if(!G.length)return;
 if(it.src==='tm'){OPEN[k]=new Set();return}                       // saisons repliées par défaut, on ouvre celle qu'on veut
 const g=G.find(g=>P.next&&g.L.includes(P.next))||(P.seen?G[G.length-1]:G[0]);OPEN[k]=new Set([g.id])}
function openDet(k){SCRS.push(scrollY);VIEW=k;if((obj(k)||{}).src==='tm')delete OPEN[k];initOpen(k);history.pushState({v:k,sub:SUBV},'');render();scrollTo(0,0);loadDet(k)}
function openSub(t){SCRS.push(scrollY);SUBV=t;history.pushState({sub:t},'');render();scrollTo(0,0)}
addEventListener('popstate',e=>{const st=e.state||{};F=null;VIEW=st.v||null;SUBV=st.sub||null;render();scrollTo(0,SCRS.pop()||0)});

/* ============ Vues ============ */
const img=(it,cls)=>it.p?`<img src="${esc(it.p)}" alt="" loading=lazy>`:`<span class=ph>${esc(it.t)}</span>`;
function card(it,mode){const inl=!!S.items[it.k];let ex='';
 if(mode==='list'){const P=prog(it);ex=`<div class="pb${P.pct>=100&&!P.open||it.s==='done'?' dn':''}"><i style="width:${it.s==='done'?100:P.pct}%"></i></div><b>${esc(it.t)}</b><small>${P.open?(it.w.length?'Ch. '+maxSeen(it):'Pas commencé'):P.seen+' / '+P.total}</small>`}
 else ex=`<b>${esc(it.t)}</b><small>${it.yr||''}</small>`;
 return`<button class="pc${mode==='list'?' lm':''}" data-a=open data-k="${it.k}"><div class=im>${img(it)}<span class=tg>${esc(it.lb)}</span>${mode!=='list'&&inl?`<span class=in>${SI('check',14,3)}</span>`:''}</div>${ex}</button>`}
const chips=(L,cur,a)=>`<div class=chips>${L.map(([v,l])=>`<button class="chip${cur===v?' on':''}" data-a=${a} data-v=${v}>${l}</button>`).join('')}</div>`;
const tabbar=()=>`<nav class=tabs>${[['disc','search','Discover'],['home','home','Home'],['list','list','My List'],['cal','cal','Calendrier']].map(([k,i,l])=>`<button class="${TAB===k?'on':''}" data-a=tab data-t=${k}><span>${SI(i,24)}</span>${l}</button>`).join('')}</nav>`;

/* Home : ce que je regarde, façon TVTime */
const STALE=30*DAY,lastW=it=>it.lw||it.u||it.a||0;
function homeSets(){const X=Object.values(S.items).filter(it=>it.s==='cur').map(it=>({it,P:prog(it)})).filter(x=>x.P.next).sort((a,b)=>lastW(b.it)-lastW(a.it)),now=Date.now();
 return{next:X.filter(x=>x.P.seen&&now-lastW(x.it)<=STALE),fresh:X.filter(x=>!x.P.seen),stale:X.filter(x=>x.P.seen&&now-lastW(x.it)>STALE)}}
const nxLab=(it,P)=>`<strong>${it.src==='tm'?'S'+P.next.s+'E'+P.next.e:(it.ty==='M'?'Ch. ':'Ép. ')+P.next.e}</strong>${!P.open&&P.left>1?`<span> +${P.left-1}</span>`:''}`;
function nextHTML(X){
 if(S.hv==='g')return`<div class="grid ng">${X.map(({it,P})=>`<button class=pc data-a=open data-k="${it.k}"><div class=im>${img(it)}<span class=ob><i style="width:${P.pct}%"></i></span></div><span class=nl>${nxLab(it,P)}</span></button>`).join('')}</div>`;
 return X.map(({it,P})=>`<div class=nr><button class=th data-a=open data-k="${it.k}">${img(it)}</button><button class=tx data-a=open data-k="${it.k}"><b>${esc(it.t)}</b><span class=nl>${nxLab(it,P)}</span><em>${P.open?'Ch. '+maxSeen(it)+' lu':P.seen+'/'+P.total}</em><span class=pb><i style="width:${P.pct}%"></i></span></button><button class=ck data-a=tg data-k="${it.k}" data-id="${P.next.id}" aria-label="Marquer comme vu">${SI('check',20,3)}</button></div>`).join('')}
const hvBtn=()=>`<button class=hv data-a=hv aria-label="Changer d’affichage">${SI(S.hv==='g'?'rows':'tiles',24)}</button>`;
const mini=(l,X)=>X.length?`<h2>${l}<small>${X.length}</small></h2><div class="hs mix">${X.map(({it})=>card(it,'list')).join('')}</div>`:'';
const HSEC=[['T','Séries'],['A','Animés'],['M','Mangas']];
function homeView(){const all=Object.values(S.items),H=homeSets(),MAX=5;
 if(!all.length)return`<header><h1>Home</h1>${gear}</header><div class=empty><b>Ta liste est vide</b>Cherche un manga, un animé ou une série dans Discover pour commencer à suivre ta progression.</div><button class=big data-a=tab data-t=disc>Découvrir des œuvres</button>`;
 const sec=HSEC.map(([t,l])=>{const X=H.next.filter(x=>x.it.ty===t);return X.length?`<h2 class=h2r><span>${l}<small>${X.length}</small></span>${X.length>MAX?`<button data-a=all data-v="next:${t}">Tout voir (${X.length})</button>`:''}</h2>${nextHTML(X.slice(0,MAX))}`:''}).join('');
 return`<header><h1>Home</h1><span class=hbt>${H.next.length?hvBtn():''}${gear}</span></header>
 ${sec||`<div class=note>${H.fresh.length||H.stale.length?'Rien en cours pour le moment.':'Tu es à jour partout. Les nouveaux épisodes apparaîtront ici dès leur sortie ; les dates sont dans l’onglet Calendrier.'}</div>`}
 ${mini('Pas commencées',H.fresh)}${mini('Pas regardées depuis un moment',H.stale)}`}

/* Calendrier : prochaines sorties des séries et animés suivis, jour par jour */
function calView(){const up=Object.values(S.items).filter(it=>it.s==='cur'||it.s==='plan').map(it=>({it,o:nextOut(it)})).filter(x=>x.o).sort((a,b)=>a.o.at-b.o.at);
 let out='',cur=null;
 for(const{it,o}of up){const D=new Date(o.at),d0=new Date(D.getFullYear(),D.getMonth(),D.getDate()).getTime(),dd=Math.round((d0-today0())/DAY);
  if(d0!==cur){cur=d0;const full=D.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
   out+=`<h2 class=h2r><span>${dd<=0?'Aujourd’hui':dd===1?'Demain':full}</span><small>${dd<=1?full:'dans '+dd+' j'}</small></h2>`}
  out+=`<button class=rw data-a=open data-k="${it.k}" style="width:100%"><span class=th>${img(it)}</span><span class=tx><b>${esc(it.t)}</b><span>${o.lab} · ${esc(it.lb)}</span></span>${o.d?'':`<span class=dd><b>${D.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</b></span>`}</button>`}
 return`<header><h1>Calendrier</h1>${gear}</header>${out||`<div class=empty><b>Aucune sortie annoncée</b>Les prochains épisodes de tes séries et animés en cours apparaîtront ici, jour par jour.</div>`}`}

/* Rangées de My List : « À voir plus tard » (tous types), puis une rangée par type */
const SECS=[['plan','À voir plus tard'],['T','Mes séries'],['A','Mes animés'],['M','Mes mangas']];

 const X=secItems(SUBV),l=(SECS.find(x=>x[0]===SUBV)||[])[1]||'';
 return`<header class=sh><button class=ib data-a=back aria-label="Retour">${SI('back',20)}</button><h1>${l}<small>${X.length}</small></h1></header>
 ${X.length?`<div class="grid${SUBV==='plan'?' mix':''}">${X.map(x=>card(x,'list')).join('')}</div>`:`<div class=empty><b>Rien ici</b>Cette rangée est vide.</div>`}`}
function listView(){const all=Object.values(S.items);
 const epi=all.filter(x=>x.ty!=='M').reduce((a,x)=>a+x.w.length,0),ch=all.filter(x=>x.ty==='M').reduce((a,x)=>a+x.w.length,0);
 const row=([t,l])=>{const X=secItems(t);return X.length?`<h2 class=h2r><span>${l}<small>${X.length}</small></span>${X.length>1?`<button data-a=all data-v=${t}>Tout voir</button>`:''}</h2><div class="hs${t==='plan'?' mix':''}">${X.map(x=>card(x,'list')).join('')}</div>`:''};
 const sec=SECS.map(row).join('');
 return`<header><h1>My List</h1>${gear}</header>
 <div class=stats><div><b>${all.length}</b><span>œuvres</span></div><div><b>${epi}</b><span>épisodes vus</span></div><div><b>${ch}</b><span>chapitres lus</span></div></div>
 ${chips([['all','Tous les statuts'],...UST],FS,'fs')}
 ${sec||`<div class=empty><b>Rien ici</b>${all.length?'Aucune œuvre ne correspond à ce statut.':'Ajoute des œuvres depuis Discover.'}</div>`}`}

function detView(){const it=obj(VIEW);if(!it)return'';const inl=!!S.items[it.k],D=DET[it.k],P=prog(it),G=groups(it,P.L),O=OPEN[it.k]||new Set(),o=nextOut(it),u=unit(it);
 const row=x=>{const on=P.w.has(x.id),se=D&&it.src==='tm'&&D.se[x.s]&&D.se[x.s][x.e],at=se&&se.d?dloc(se.d):D&&D.sc[x.e];
  const sub=at?new Date(at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):(x.ok?'':'Pas encore sorti');
  return`<div class="er${x.ok?'':' fu'}">${it.src==='tm'?`<span class=et>${se&&se.s?`<img src="${IMG}w185${esc(se.s)}" alt="" loading=lazy>`:''}</span>`:''}<div class=tx><b>${it.src==='tm'?'E'+x.e+(se&&se.n?' · '+esc(se.n):''):epLab(it,x)}</b>${sub?`<small>${sub}</small>`:''}</div>${se&&se.n?`<button class=em data-a=epi data-s=${x.s} data-e=${x.e} hidden aria-label="Voir le titre complet">${SI('dots',18,2.6)}</button>`:''}<button class="ck${on?' on':''}" data-a=tg data-k="${it.k}" data-id="${x.id}" ${x.ok||on?'':'disabled'} aria-label="${on?'Vu':'Marquer comme vu'}">${SI('check',20,3)}</button></div>`};
 const tiles=g=>`<div class=cg>${g.L.map(x=>`<button class="cn${P.w.has(x.id)?' on':''}" data-a=tg data-k="${it.k}" data-id="${x.id}">${x.e}</button>`).join('')}</div>`,rows=g=>it.ty==='M'?tiles(g):g.L.map(row).join('');
 const more=P.open?`<button class=more data-a=more>+ Afficher 25 chapitres de plus</button>`:'';
 const body=G.map((g,i)=>{const s=g.L.filter(x=>P.w.has(x.id)).length,ok=g.L.filter(x=>x.ok).length,full=ok>0&&s>=ok,last=i===G.length-1;
  if(!g.t)return`<div class=gp>${rows(g).replace('class="er','style="border-top:0" class="er')}${more}</div>`;
  const op=O.has(g.id);return`<div class="gp${op?' op':''}"><div class=gh><button class=gt data-a=grp data-g="${g.id}">${SI('chev',16)}<b>${esc(g.t)}</b><small>${s} / ${g.L.length}</small></button><button class="ck${full?' on':''}" data-a=gall data-g="${g.id}" ${ok?'':'disabled'} aria-label="Tout marquer">${SI('check',20,3)}</button></div>${op?rows(g)+(last?more:''):''}</div>`}).join('');
 return`<button class=bk data-a=back aria-label="Retour">${SI('back',22)}</button><button class="bk mo" data-a=menu aria-label="Plus d’actions">${SI('dots',22,2.6)}</button>
 <div class=hero style="${D&&D.ban?`background-image:url('${esc(D.ban)}')`:''}"></div>
 <div class=hd><div class=po>${img(it)}</div><div><h1>${esc(it.t)}</h1><div class=mut>${[it.lb,it.yr||'',STL[it.st]||''].filter(Boolean).join(' · ')}</div>${it.g&&it.g.length?`<div class=gen>${it.g.map(esc).join(' · ')}</div>`:''}</div></div>
 ${inl?chips(UST,it.s,'us'):`<button class=big data-a=add>+ Ajouter à ma liste</button>`}
 ${inl||P.seen?`<div class=prg><div class="pb${P.pct>=100&&!P.open?' dn':''}"><i style="width:${P.pct}%"></i></div><div><span>${P.open?(P.seen?'Lu jusqu’au chapitre '+maxSeen(it)+' · total inconnu, sortie en cours':'Pas commencé'):P.seen+' / '+P.total+' '+u+'s'}</span><span>${P.open?'':P.pct+' %'}</span></div></div>`:''}
 ${o?(w=>`<div class=nxt>${SI('cal',22)}<div><b>${o.lab} · ${w.a}${w.b?' ('+w.b+')':''}</b>${o.est?'Estimation d’après le jour de sortie choisi':'Prochaine sortie'}</div></div>`)(when(o)):''}
 ${D&&D.desc?`<p class=desc data-a=desc>${esc(D.desc)}</p>`:''}
 ${it.ty==='M'?`<div class=box><label>J’en suis au chapitre…</label><div class=inl><input id=upto type=number inputmode=numeric min=0 placeholder="ex. 132" value="${maxSeen(it)||''}"><button data-a=upto>OK</button></div></div>`:''}
 ${it.ty==='M'?'':`<h2>${it.src==='tm'&&G.length>1?'Saisons':'Épisodes'}</h2>
 ${D&&D.err?`<p class=err>${esc(D.err)}</p>`:''}${body||(D?`<div class=note>Aucun ${u} annoncé pour l’instant.</div>`:`<div class=empty>Chargement…</div>`)}`}
 ${D&&D.cast&&D.cast.length?`<h2>Acteurs</h2><div class="hs cast">${D.cast.map(c=>`<div class=ca><span class=ph2>${c.p?`<img src="${esc(c.p)}" alt="" loading=lazy>`:esc((c.n||'?').split(' ').map(w=>w[0]).slice(0,2).join(''))}</span><b>${esc(c.r||'—')}</b><small>${esc(c.n)}</small>${c.v?'<em>voix</em>':''}</div>`).join('')}</div>`:''}`}

function overlay(){const f=F;if(!f)return'';
 if(f.k==='ask')return`<div class="sov pop" data-a=fno><div class=dpop><h3>${esc(f.lab)}</h3><p>${f.n>1?'Il y a '+f.n+' '+unit(obj(f.key))+'s précédents non cochés.':'Le précédent n’est pas coché.'} As-tu aussi vu ${f.n>1?'les précédents':'le précédent'} ?</p>
  <button class="dbt gr" data-a=askall>Oui, ${f.n>1?'tous les précédents aussi':'le précédent aussi'}</button><button class=dbt data-a=askone>Seulement ${esc(f.lab)}</button><button class="dbt tx" data-a=fno>Annuler</button></div></div>`;
 if(f.k==='ep'){const e=((DET[f.key]||{}).se[f.s]||{})[f.e]||{};return`<div class="sov pop" data-a=fno><div class=dpop><p>Saison ${f.s} · Épisode ${f.e}${e.d?' · '+new Date(dloc(e.d)).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):''}</p><h3>${esc(e.n||'')}</h3>${e.o?`<p class=epo>${esc(e.o)}</p>`:''}<button class=dbt data-a=fno>Fermer</button></div></div>`}
 if(f.k==='rm')return`<div class="sov pop" data-a=fno><div class=dpop><h3>Retirer de ta liste ?</h3><p>Ta progression sur « ${esc(obj(f.key).t)} » sera effacée.</p><button class="dbt red" data-a=rmok>Retirer</button><button class="dbt tx" data-a=fno>Annuler</button></div></div>`;
 if(f.k==='menu'){const it=obj(f.key),inl=!!S.items[it.k],P=prog(it),u=unit(it),ok=P.L.filter(x=>x.ok).length,
   M=(a,i,t,sub,cls)=>`<button class="mi ${cls||''}" data-a=${a}><i>${SI(i,24)}</i><span><b>${t}</b><small>${sub||''}</small></span></button>`;
  return`<div class=sov data-a=fno><div class="sheet cfg"><div class=grab></div><h2>${esc(it.t)}</h2>
  ${inl?'':M('madd','plus','Ajouter à ma liste','','gr')}
  ${inl&&it.s==='plan'?'':M('mlater','mark','À voir plus tard','Range l’œuvre dans ta rangée « À voir plus tard ».')}
  ${ok&&P.left&&!P.open?M('mall','check','Tout marquer comme vu',pl(ok,u)+' '+(ok>1?'sortis':'sorti')):''}
  ${P.seen?M('mzero','undo','Remettre à zéro','Décoche tous les '+u+'s.'):''}
  ${M('ext','ext','Voir sur '+(it.src==='tm'?'TMDB':'AniList'),'Ouvre la page de l’œuvre.')}
  ${inl?M('rm','trash','Retirer de ma liste','Efface aussi ta progression.','red'):''}</div></div>`}
 if(f.k==='cfg'){const c=S.cfg,fld=(k,l,ph,t)=>`<div class="orow fld"><b>${l}</b><input class=soft data-cfg=${k} placeholder="${ph}" value="${esc(c[k])}" ${t||''} autocomplete=off autocapitalize=off spellcheck=false></div>`,
   MI=(a,i,t,sub,x)=>`<button class="mi${x?' gr':''}" data-a=${a}><i>${SI(i,24)}</i><span><b>${t}</b><small${a==='sync'?' id=msg':''}>${sub}</small></span></button>`;
  return`<div class=sov data-a=fno><div class="sheet cfg"><div class=grab></div><h2>Réglages</h2>
  <div class=opl>THEMOVIEDB.ORG</div><div class=ocard>${fld('tmdb','Clé API','Colle ta clé TMDB ici','type=password')}</div>
  <div class=opl>SYNCHRONISATION GITHUB</div><div class=ocard>${fld('repo','Dépôt privé','utilisateur/depot-prive')}${fld('path','Fichier','mangatime-data.json')}${fld('token','Jeton d’accès','','type=password')}</div>
  ${MI('sync','sync','Synchroniser maintenant',esc(MSG)||'Envoie et récupère tes données.',1)}
  <div class=opl>SAUVEGARDE</div>${MI('exp','down','Exporter mes données','Télécharge une copie de ta liste.')}${MI('imp','upl','Importer un fichier','Fusionne une sauvegarde avec ta liste.')}<input id=file type=file accept="application/json,.json" hidden>
  <p class=cred>Données : AniList et TMDB. Ce produit utilise l’API TMDB mais n’est ni approuvé ni certifié par TMDB.</p></div></div>`}
 return''}

function render(){const a=$('#app');
 a.innerHTML=(VIEW?detView():SUBV?subView():(TAB==='disc'?discView():TAB==='list'?listView():TAB==='cal'?calView():homeView())+tabbar())+overlay();
 document.body.style.overflow=F?'hidden':'';
 /* le bouton ⋯ n'apparaît que si le titre de l'épisode est coupé */
 if(VIEW)a.querySelectorAll('.er').forEach(r=>{const m=r.querySelector('.em'),b=r.querySelector('.tx b');if(m)m.hidden=b.scrollHeight<=b.clientHeight+1})}

/* ============ Actions ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a==='fno'){if(e.target!==b)return;return closeF()}
 if(a==='tab'){TAB=d.t;render();scrollTo(0,0);if(TAB==='disc'&&!RES)search();if(TAB==='cal')refreshAll();return}
 if(a==='open')return openDet(d.k);
 if(a==='all')return openSub(d.v);
 if(a==='back')return history.back();
 if(a==='cfg'){F={k:'cfg'};return render()}
 if(a==='dt'){DT=d.v;RES=null;render();return search()}
 if(a==='clr'){const q=$('#q');q.value='';Q='';b.hidden=true;q.focus();clearTimeout(ST);return search()}
 if(a==='fs'){FS=d.v;return render()}
 if(a==='tg')return tog(d.k,d.id);
 if(a==='askall')return markUpTo(F.key,F.id,true);
 if(a==='askone')return markUpTo(F.key,F.id,false);
 const it=VIEW&&obj(VIEW);
 if(a==='add'){const x=ensure(VIEW);touch(x);return render()}
 if(a==='us'){it.s=d.v;touch(it);return render()}
 if(a==='hv'){S.hv=S.hv==='g'?'l':'g';persist();return render()}
 if(a==='epi'){F={k:'ep',key:VIEW,s:+d.s,e:+d.e};return render()}
 if(a==='menu'){F={k:'menu',key:VIEW};return render()}
 if(a==='madd'){const x=ensure(VIEW);F=null;touch(x);return render()}
 if(a==='mall'){const x=ensure(VIEW),w=seenSet(x);eps(x).forEach(y=>y.ok&&w.add(y.id));F=null;return commit(x,w)}
 if(a==='mzero'){F=null;return commit(it,new Set())}
 if(a==='mlater'){const x=ensure(VIEW);x.s='plan';F=null;touch(x);return render()}
 if(a==='ext'){F=null;render();return window.open(it.src==='tm'?'https://www.themoviedb.org/tv/'+it.id:'https://anilist.co/'+(it.ty==='M'?'manga':'anime')+'/'+it.id,'_blank','noopener')}
 if(a==='rm'){F={k:'rm',key:VIEW};return render()}
 if(a==='rmok'){const k=F.key,x=S.items[k];delete S.items[k];S.del[k]=Date.now();BR[k]=Object.assign({},x,{w:[],s:undefined,day:undefined,cnt:undefined});S.dirty=1;persist();schedSync();F=null;return history.back()}
 if(a==='desc')return b.classList.toggle('op');
 if(a==='grp'){const O=OPEN[VIEW]=OPEN[VIEW]||new Set();if(O.has(d.g))O.delete(d.g);else{O.add(d.g);if(it.src==='tm')loadSeason(VIEW,+d.g)}return render()}
 if(a==='gall'){const x=ensure(VIEW),P=prog(x),g=groups(x,P.L).find(g=>g.id===d.g),ok=g.L.filter(y=>y.ok),full=ok.every(y=>P.w.has(y.id));ok.forEach(y=>full?P.w.delete(y.id):P.w.add(y.id));return commit(x,P.w)}
 if(a==='more'){it.cnt=eps(it).length+25;if(S.items[VIEW])touch(it);return render()}
 if(a==='upto'){const n=Math.max(0,Math.floor(+$('#upto').value||0)),x=ensure(VIEW);if(x.tot&&n>x.tot)return alertMsg('Cette œuvre compte '+x.tot+' chapitres.');
  if(!x.tot)x.cnt=Math.max(x.cnt||0,n+1);const w=new Set();for(let i=1;i<=n;i++)w.add(i);delete OPEN[VIEW];x.w=[...w];commit(x,w);initOpen(VIEW);return render()}
 if(a==='split'){const x=ensure(VIEW),v=($('#split').value.match(/\d+/g)||[]).map(Number).filter(n=>n>0&&n<5000).slice(0,30);x.sp=v.length?v:undefined;delete OPEN[VIEW];touch(x);initOpen(VIEW);return render()}
 if(a==='day'){const x=ensure(VIEW),v=+d.v;x.day=x.day===v?null:v;touch(x);return render()}
 if(a==='sync'){setMsg('Synchronisation…');return sync(true)}
 if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify({items:S.items,del:S.del},null,1)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='mangatime-'+new Date().toISOString().slice(0,10)+'.json';l.click();return setTimeout(()=>URL.revokeObjectURL(u),2e3)}
 if(a==='imp')return $('#file').click()});
let CL=0;
function closeF(){const o=$('.sov');if(!F||!o||CL)return;CL=1;o.classList.add('out');setTimeout(()=>{CL=0;F=null;render();if(TAB==='disc'&&!VIEW&&!RES)search()},o.classList.contains('pop')?200:280)}
function setMsg(m){MSG=m;const el=$('#msg');if(el)el.textContent=m}
function alertMsg(m){const el=$('#upto');if(el){el.value='';el.placeholder=m}}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){Q=t.value.trim();$('#clr').hidden=!t.value;clearTimeout(ST);ST=setTimeout(search,450)}
 if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.value.trim();persist();if(t.dataset.cfg==='tmdb'){RES=DT==='M'?RES:null;RERR=''}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){clearTimeout(ST);e.target.blur();search()}if(e.key==='Enter'&&e.target.id==='upto')$('[data-a=upto]').click()});
document.addEventListener('change',e=>{if(e.target.id!=='file'||!e.target.files[0])return;const r=new FileReader();
 r.onload=()=>{try{merge(JSON.parse(r.result));S.dirty=1;persist();setMsg('Import terminé.');schedSync()}catch{setMsg('Fichier illisible.')}};r.readAsText(e.target.files[0])});

/* Feuille : glisser vers le bas pour la fermer */
let DR=null;
document.addEventListener('touchstart',e=>{const sh=e.target.closest('.sheet');DR=null;if(!sh||e.touches.length>1)return;
 DR={sh,y:e.touches[0].clientY,dy:0,ok:sh.scrollTop<=0||!!e.target.closest('.grab')}},{passive:true});
document.addEventListener('touchmove',e=>{if(!DR||!DR.ok)return;const dy=e.touches[0].clientY-DR.y;
 if(dy<=0){if(DR.dy){DR.dy=0;DR.sh.style.transform=''}return}
 if(e.cancelable)e.preventDefault();DR.dy=dy;DR.sh.style.transition='none';DR.sh.style.transform=`translateY(${dy}px)`},{passive:false});
document.addEventListener('touchend',()=>{const d=DR;DR=null;if(!d||!d.dy)return;d.sh.style.transition='transform .2s ease-out';
 if(d.dy>110){d.sh.style.transform='translateY(100%)';d.sh.parentNode.style.transition='opacity .2s';d.sh.parentNode.style.opacity=0;setTimeout(()=>{F=null;render()},200)}else d.sh.style.transform=''});

/* ============ Synchro GitHub (même principe que Muscu) ============ */
const api=()=>`https://api.github.com/repos/${S.cfg.repo}/contents/${S.cfg.path||'mangatime-data.json'}`;
const H=()=>({Authorization:'Bearer '+S.cfg.token,Accept:'application/vnd.github+json'});
async function pull(){const r=await fetch(api(),{headers:H(),cache:'no-store'});if(r.status===404){S.sha='';return null}
 if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();S.sha=j.sha;
 return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}
async function push(){let b='';new TextEncoder().encode(JSON.stringify({items:S.items,del:S.del})).forEach(c=>b+=String.fromCharCode(c));
 const r=await fetch(api(),{method:'PUT',headers:H(),body:JSON.stringify({message:'Sync '+new Date().toISOString(),content:btoa(b),sha:S.sha||undefined})});
 if(!r.ok)throw new Error('GitHub '+r.status);S.sha=(await r.json()).content.sha}
/* Fusion : pour chaque œuvre on garde la version modifiée le plus récemment ; les suppressions sont datées */
function merge(rm){let newer=false;const ri=rm.items||{},rd=rm.del||{};
 for(const k in rd)if((rd[k]||0)>(S.del[k]||0))S.del[k]=rd[k];
 for(const k in ri){const l=S.items[k];if(!l||(ri[k].u||0)>(l.u||0))S.items[k]=ri[k]}
 for(const k in S.items){const x=S.items[k];if((S.del[k]||0)>(x.u||x.a||0))delete S.items[k];else if(!ri[k]||(x.u||0)>(ri[k].u||0))newer=true}
 for(const k in S.del)if(ri[k]&&!S.items[k])newer=true;
 return newer}
let SYNCING=false,SY=0;
async function sync(manual){if(!S.cfg.repo||!S.cfg.token){if(manual)MSG='Renseigne le dépôt et le jeton pour activer la synchro.';return}
 if(SYNCING)return;SYNCING=true;
 try{const rm=await pull(),newer=rm?merge(rm):true;
  if(newer||S.dirty){try{await push()}catch{const r2=await pull();if(r2)merge(r2);await push()}}
  S.dirty=0;MSG='Synchronisé à '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
 catch(e){MSG='Échec de la synchronisation : '+e.message+' (vérifie dépôt, jeton, réseau)'}
 SYNCING=false;persist();setMsg(MSG);if(!F&&!document.activeElement.matches('input'))render()}
function schedSync(){clearTimeout(SY);SY=setTimeout(()=>sync(),4000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sync();refreshAll()}});

/* Démarrage */
history.replaceState({},'');
render();sync().then(()=>refreshAll());
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
